name: AgentSINC local runtime checks

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/phase3-local-runtime.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/phase3-local-runtime.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Python syntax and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend sources
        run: python -m compileall -q app
      - name: Run API tests
        run: pytest -q
