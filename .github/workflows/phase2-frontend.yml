name: AgentSINC frontend checks

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/phase2-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/phase2-frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
